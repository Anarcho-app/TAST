rules:
- publication_ready requires book page or reporter citation + verbatim_excerpt
- Aggregates only after more cases filled from Gross with pages
- These two cases document that classification was adversarially contested in court
  — structural support for H2 mechanism documentation, not a national rate
gross_yale_lj_note: Gross, Litigating Whiteness, 108 Yale L.J. 109 (1998) surveys
  numerous nineteenth-century racial determination trials with reporter citations.
  One extract notes analysis spanning dozens of trials; seed rows here are those with
  explicit reporter cites in the PDF extract. All publication_ready=false until page-level
  quotes from Gross or official reporters are attached.

cases:
- case_id: morrison_1857_la
  year: 1857
  jurisdiction: Jefferson Parish / Carrollton, Louisiana
  court_or_forum: Louisiana trial courts (freedom suit / racial identity)
  criterion_invoked: appearance; reputation; "common sense" of race; witness testimony
    that locals can detect African origin
  contested: true
  outcome: Gross recounts Morrison (described as blond-haired, blue-eyed) convinced
    jailer and white witnesses she was white and wrongly held as a slave; case used
    in Gross as exemplar of performance/reputation criteria over blood fractions.
  archive_or_citation: Gross, What Blood Won't Tell (opening case narrative); discussed
    in secondary literature e.g. Southern California Law Review review of Gross
  stable_url_or_doi: https://gould.usc.edu/news/an-interview-with-ariela-gross-on-race/
  verbatim_excerpt: null
  independence_group: legal_adjudication
  enslaved_voice_status: partial
  verified_at: '2026-07-24'
  publication_ready: false
  notes: Seed only — add reporter citation and page from Gross before elevating to
    quantitative stream.
- case_id: hudgins_v_wright_1806_va
  year: 1806
  jurisdiction: Virginia
  court_or_forum: Virginia Court of Appeals (on appeal from High Court of Chancery,
    Wythe)
  criterion_invoked: maternal ancestry (Indian vs African); appearance; partus sequitur
    ventrem; presumption from 1705 ban on Indian slavery
  contested: true
  outcome: 'Jackey Wright and children held free. Court: appellant failed to prove
    maternal African ancestry; Indian descent through maternal line + appearance supported
    freedom under long ban on Indian slavery.'
  archive_or_citation: Hudgins v. Wright, 11 Va. (1 Hen. & M.) 134 (1806); standard
    casebooks; Wikipedia/Wythepedia summaries consistent on outcome
  stable_url_or_doi: https://en.wikipedia.org/wiki/Hudgins_v._Wright
  verbatim_excerpt: null
  independence_group: legal_adjudication
  enslaved_voice_status: partial
  verified_at: '2026-07-24'
  publication_ready: false
  notes: Classic freedom suit with racial classification contested in-record. Seed
    — add official reporter page quotes.
- case_id: abby_guy_1855_ar
  year: 1855
  jurisdiction: Ashley County, Arkansas
  court_or_forum: Circuit Court (freedom suit)
  criterion_invoked: appearance; claim of whiteness; performance of white womanhood
  contested: true
  outcome: Gross (Litigating Whiteness, Yale L.J. 1998) recounts Abby Guy sued William
    Daniel claiming she and her children were white and wrongly held as slaves. Case
    used as exemplar of courtroom performance of race.
  archive_or_citation: Gross, Litigating Whiteness, 108 Yale L.J. 109 (1998); referenced

- id: goodman_nyabg_isotopes
  citation: Goodman, A.H., et al. Isotopic and Elemental Chemistry of Teeth. Chapter
    6 in Skeletal Biology of the New York African Burial Ground, Vol. 1 (GSA/NPS Final
    Report).
  site: New York African Burial Ground (NYABG)
  stable_url: https://sites.hampshire.edu/agoodman/files/2019/03/Chapter_6_Isotopic_and_Elemental_Chemistry_of_Teet.pdf
  official_report: https://www.gsa.gov/system/files/Vol1-Part1-TheSkeletalBiologyOfTheNYAGB_Chapters1-6.pdf
  sample:
    n_teeth_total_analyzed: 40
    n_nyabg_teeth: 37
    n_modified_adults_in_chemical_sample: 13
    n_nonmodified_subadults_in_chemical_sample: 19
    n_ghana_reference_molars: 2
    n_observable_modified_dentitions_excavation: 26
    note: Chemical sample is selected (modified adults + young non-modified subadults),
      not a random sample of all 419 recovered or of the estimated 15,000+ interments.
  inference_rule:
    african_born_proxy: Culturally modified teeth (and typically higher enamel 87Sr/86Sr
      outside Manhattan range ~0.711–0.712)
    local_ny_born_proxy: Young non-modified subadults (died early; enamel/dentin Sr
      cluster ~0.711–0.712)
    caveats:
    - Proxy-based; some individuals mixed on Sr vs ESA (e.g. Burial 101, 106, 281).
    - Cannot be read as site-wide % African-born without a sampling model.
    - Ancestry ≠ birthplace for genetic studies; this chapter is isotope + modification.
  published_numerical_anchors:
    local_sr_range_approx: 0.711–0.712
    nist987_replicate: 0.710262 ± 0.000009 (2σ)
    lead_ppm_range_subset: 1.2–112.2 µg/g (n=6 quantitative Pb)
    lead_pattern: Elevated in non-modified (NY exposure) vs modified in reported comparisons
  conservative_encoding_for_model:
    status: coding_table_v1_recorded
    k: 13
    n: 32
    p_hat: 0.40625
    usable_as: NYABG chemical-sample proxy only; not national
  usable_for:
  - method_demonstration
  - presence_of_both_birthplace_proxies_in_sample
  - sampling_model_design
  not_usable_for:
  - national_african_born_proportion
  - unmodeled_site_wide_percentage
  verified_at: '2026-07-24'
  extraction_source: Direct from Goodman Ch.6 PDF (Hampshire mirror) + GSA Vol1 Part1
  coding_table_v1:
    rule: 'Chemical sample only (Goodman Ch.6): modified adults → African-born proxy;
      non-modified subadults in sample → local NY-born proxy.'
    n: 32
    k_african_born_proxy: 13
    k_local_ny_born_proxy: 19
    source_counts:
      n_modified_adults_in_chemical_sample: 13
      n_nonmodified_subadults_in_chemical_sample: 19
    proportion_african_born_proxy: 0.4062
    caveats:
    - Selected sample (not random among 419 recovered or 15k+ estimated).
    - Proxy classification; mixed Sr/ESA cases exist (e.g. Burials 101, 106, 281).
    - Do not export as site-wide or national African-born rate.
    - Suitable only as a low-weight, high-uncertainty floor term with explicit sampling
      model.
    beta_binomial_suggestion:
      status: optional_low_weight_term
      k: 13
      n: 32
      note: Use only with strong sampling caveat; prior on p should be weakly informative.
    verified_at: '2026-07-24'

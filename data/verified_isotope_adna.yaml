m1_encoding_notes:
  target: Beta-Binomial on African-born proportion per site, hypothesis-conditional
  formula: P(k African-born of n | H_i) = Binom(n,k) * B(k+α_i, n-k+β_i) / B(α_i,
    β_i)
  requirement: α_i, β_i documented from isotope literature; H1 centered higher African-born
    early, declining; H2 different trajectory
  flag: is_floor_quantitative — bypasses apply_reliability; active at all r
  sampling_model: port burial grounds skew first-generation independent of mechanism
    — sampling term required, not a likelihood tweak
  do_not_encode_until: Goodman tables + any additional published birthplace calls
    extracted with page/table refs
